<svg xmlns="http://www.w3.org/2000/svg" width="360" height="322" viewBox="0 0 360 322" role="img" aria-label="Quine Institute — a college management backend for admissions, exams, promotion and fees">
<style>
  @keyframes flow { 0% { stroke-dashoffset: 120; } 68% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  @keyframes run { 0% { transform: translateY(0); opacity: 0; } 6% { opacity: 1; }
                    68% { transform: translateY(120px); opacity: 1; } 76% { opacity: 0; } 100% { transform: translateY(120px); opacity: 0; } }
  @keyframes pop { 0%, 100% { r: 3.2; } 50% { r: 4.6; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .flow { stroke-dasharray: 120; animation: flow 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    .run  { animation: run 4.6s cubic-bezier(.4,0,.2,1) infinite; }
    .f    { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .f0 { animation-delay: .05s } .f1 { animation-delay: .18s } .f2 { animation-delay: .3s }
  }
</style>
<text x="20" y="38" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#8F9AA4" letter-spacing="1.4">SPRING BOOT · JAVA 21 · POSTGRESQL</text>
<text x="19" y="86" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="33" fill="#14181C">Quine Institute</text>
<rect x="20" y="98" width="32" height="3" fill="#2E6E8E"/>
<text x="20" y="122" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="11" fill="#5A6672">A college, written as a backend.</text>
<line x1="26" y1="152" x2="26" y2="272" stroke="#D9D2C3"/>
<line class="flow" x1="26" y1="152" x2="26" y2="272" stroke="#2E6E8E" stroke-width="1.6" stroke-linecap="round"/>
<circle cx="26" cy="152.0" r="3" fill="#2E6E8E" fill-opacity="0.35"/>
<text x="42" y="155.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#5A6672" letter-spacing="1.2">APPLICATION</text>
<circle cx="26" cy="182.0" r="3" fill="#2E6E8E" fill-opacity="0.50"/>
<text x="42" y="185.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#5A6672" letter-spacing="1.2">PROGRAM</text>
