<text x="42" y="215.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#5A6672" letter-spacing="1.2">SEMESTER</text>
<circle cx="26" cy="242.0" r="3" fill="#2E6E8E" fill-opacity="0.80"/>
<text x="42" y="245.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8.5" fill="#5A6672" letter-spacing="1.2">SUBJECT</text>
<circle cx="26" cy="272.0" r="3" fill="#2E6E8E" fill-opacity="0.95"/>
