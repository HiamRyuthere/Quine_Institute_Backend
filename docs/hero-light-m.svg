<circle class="run" cx="26" cy="152" r="4" fill="#B5763A"/>
<text x="20" y="306" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="8" fill="#2E6E8E" letter-spacing="1.2">25+ ENDPOINTS · 12 ENTITIES · 5 ROLES</text>
