<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="364" viewBox="0 0 1280 364" role="img" aria-label="Quine Institute — a college management backend for admissions, exams, promotion and fees">
<style>
  @keyframes flow { 0% { stroke-dashoffset: 476; } 68% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
  @keyframes run { 0% { transform: translateX(0); opacity: 0; } 6% { opacity: 1; }
                    68% { transform: translateX(476px); opacity: 1; } 76% { opacity: 0; } 100% { transform: translateX(476px); opacity: 0; } }
  @keyframes pop { 0%, 100% { r: 3.2; } 50% { r: 4.6; } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .flow { stroke-dasharray: 476; animation: flow 5.2s cubic-bezier(.4,0,.2,1) infinite; }
    .run  { animation: run 5.2s cubic-bezier(.4,0,.2,1) infinite; }
    .f    { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    .f0 { animation-delay: .05s } .f1 { animation-delay: .18s } .f2 { animation-delay: .3s }
  }
</style>
<text x="44" y="84" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11" fill="#8F9AA4" letter-spacing="2.4">SPRING BOOT  ·  JAVA 21  ·  POSTGRESQL</text>
<text x="41" y="176" font-family="Georgia,'Iowan Old Style','Times New Roman',serif" font-size="78" fill="#14181C">Quine Institute</text>
<rect x="44" y="200" width="52" height="4" fill="#2E6E8E"/>
<text x="44" y="240" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#5A6672">A college, written as a backend — admissions, exams, promotion, fees.</text>
<text x="44" y="266" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="10.5" fill="#2E6E8E" letter-spacing="1.4">One REST API · JWT + role-based access · normalised schema</text>
<text x="760" y="96" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="9" fill="#8F9AA4" letter-spacing="2">THE ACADEMIC CHAIN</text>
